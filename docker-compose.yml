services:
  bot:
    build: .
    container_name: discord-music-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - YTDL_NO_UPDATE=1
    # if your bot exposes a tiny HTTP server on 8889 for health/logs:
    ports:
      - "8889:8889"
    # Optional: mount source for quick iteration inside container (commented out for prod)
    # volumes:
    #   - ./:/app
    #   - /app/node_modules
