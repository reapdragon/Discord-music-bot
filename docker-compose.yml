name: projectfishy
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectfishy-bot
    env_file:
      - .env
    # Map the optional health/metrics web port (can remove if unused)
    ports:
      - "8889:8889"
    # Persist cookies.txt (if using YTDL_COOKIES) and any future cache
    volumes:
      - ./data:/data
    restart: unless-stopped
