services:
  - type: web
    name: discord-music-bot
    runtime: node
    region: frankfurt          # or: oregon, virginia, singapore, etc.
    plan: free                 # free tier => no card required
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /         # we'll serve "OK" on /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DEV_GUILD_ID          # optional (per-guild slash commands)
        sync: false
      - key: SPOTIFY_CLIENT_ID     # optional
        sync: false
      - key: SPOTIFY_CLIENT_SECRET # optional
        sync: false
      - key: YOUTUBE_API_KEY       # optional (not required by current extractor)
        sync: false
      - key: REGISTER_ON_BOOT      # optional: set "true" once, then unset
        sync: false
